name: Clean up orphaned branches
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  cleanup-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: grafana/shared-workflows/actions/cleanup-branches@fd1bb11a702aea51d7b13f222e9355e8b63e0668 # cleanup-branches/v0.3.0
        with:
          dry-run: "false"

